conky.config = {
    -- ============================================================
    -- CONKY - KDE PLASMA 6 / WAYLAND
    -- 2560x1440 @ 1.25 scale (logical: 2048x1152)
    -- Full-height panel on the right edge, translucent KDE-style panel
    -- ============================================================

    -- WAYLAND ONLY (wlr-layer-shell surface, no X11/XWayland)
    output_backend = 'wayland',

    -- WINDOW
    own_window = true,
    -- dock = bottom layer + reserved strip on the right edge, so
    -- maximized windows don't cover it
    own_window_type = 'dock',
    own_window_hints = 'below',

    -- #AARRGGBB: #30343b at alpha 165/255
    own_window_color = '#a530343b',

    -- POSITION
    -- middle_right: a dock anchors to the dominant edge, so top_right would
    -- pin it to the top (centered); middle_right pins it to the right edge
    alignment = 'middle_right',
    gap_x = 0,
    gap_y = 0,

    -- SIZE
    minimum_width = 328,
    maximum_width = 328,
    minimum_height = 1152,

    -- MARGINS & PADDING
    border_width = 0,
    border_inner_margin = 15,
    border_outer_margin = 0,

    -- UPDATE
    update_interval = 2.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    diskio_avg_samples = 2,
    no_buffers = true,

    -- FONT
    font = 'sans-serif:size=10',
    override_utf8_locale = true,

    -- DRAWING
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,

    -- COLORS
    default_color = '#ffffff',
    color0 = '#ffffff',
    color1 = '#ffffff',
    color2 = '#c2c7cf',
    color3 = 'lightgray',
    default_outline_color = '#555555',
    default_shade_color = '#555555',
};

conky.text = [[
${voffset 5}
${alignc}${color0}${font sans-serif:bold:size=28}${time %H:%M}${font}${color}
${alignc}${color2}${font sans-serif:size=11}${time %A, %b %d, %Y}${font}${color}
${alignc}${color2}Uptime: $uptime${color}

${color1}${font sans-serif:bold:size=12}SYSTEM & CPU ${hr 1}${font}${color}
${color2}OS:${color} Arch Linux ${alignr}${color2}Kernel:${color} $kernel
${color2}CPU Temp:${color} ${execi 2 sensors k10temp-pci-00c3 2>/dev/null | grep 'Tctl:' | awk '{print $2}'} ${alignr}${color2}CPU Load:${color} $cpu%
${color3}${cpubar 6}${color}
${cpugraph 45,300 555555 lightgray}

${color1}${font sans-serif:bold:size=12}MEMORY ${hr 1}${font}${color}
${color2}RAM:${color} $mem / $memmax ${alignr}${color1}$memperc%${color}
${color3}${membar 6}${color}
${color2}Swap:${color} $swap / $swapmax ${alignr}${color1}$swapperc%${color}
${color3}${swapbar 6}${color}

${color1}${font sans-serif:bold:size=12}INTEL ARC B580 GPU ${hr 1}${font}${color}
${color2}GPU Temp:${color} ${execi 2 python3 ~/.config/conky/b580.py | cut -d'|' -f1} ${alignr}${color2}VRAM Temp:${color} ${execi 2 python3 ~/.config/conky/b580.py | cut -d'|' -f2}
${color2}Clock:${color}    ${execi 2 python3 ~/.config/conky/b580.py | cut -d'|' -f3} ${alignr}${color2}Power:${color}     ${execi 2 python3 ~/.config/conky/b580.py | cut -d'|' -f4}
${color2}VRAM Used:${color} ${execi 2 python3 ~/.config/conky/b580.py | cut -d'|' -f5} / ${execi 2 python3 ~/.config/conky/b580.py | cut -d'|' -f6}

${color1}${font sans-serif:bold:size=12}NETWORK ${hr 1}${font}${color}
${color2}Down:${color} ${downspeed enp5s0} ${alignr}${color2}Up:${color} ${upspeed enp5s0}
${downspeedgraph enp5s0 45,140 555555 lightgray} ${alignr}${upspeedgraph enp5s0 45,140 555555 lightgray}
${color2}Total Down:${color} ${totaldown enp5s0} ${alignr}${color2}Total Up:${color} ${totalup enp5s0}

${color1}${font sans-serif:bold:size=12}TOP PROCESSES ${hr 1}${font}${color}
${color2}NAME               PID    CPU%   MEM%${color}
${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1}
${top name 2} ${top pid 2} ${top cpu 2} ${top mem 2}
${top name 3} ${top pid 3} ${top cpu 3} ${top mem 3}
${top name 4} ${top pid 4} ${top cpu 4} ${top mem 4}
${top name 5} ${top pid 5} ${top cpu 5} ${top mem 5}

${color1}${font sans-serif:bold:size=12}STORAGE & DISKS ${hr 1}${font}${color}
${color2}NVMe SSD (/):${color} ${fs_used /} / ${fs_size /} ${alignr}${color1}${fs_used_perc /}%${color}
${color3}${fs_bar 6 /}${color}
${if_mounted /run/media/wd-blue}
${color2}WD Blue (1.8T):${color} ${fs_used /run/media/wd-blue} / ${fs_size /run/media/wd-blue} ${alignr}${color1}${fs_used_perc /run/media/wd-blue}%${color}
${color3}${fs_bar 6 /run/media/wd-blue}${color}
${endif}
${color2}Read:${color} ${diskio_read} ${alignr}${color2}Write:${color} ${diskio_write}
${diskiograph 45,300 555555 lightgray}
]];
